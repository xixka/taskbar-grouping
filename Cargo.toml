[package]
name = "tbg-lite"
version = "0.1.0"
edition = "2021"
# §0-9（2026-10-02）：MSRV 声明 = CI 钉版口径（与 rust-toolchain.toml /
# ci.yml Install Rust 同笔同源；仓库只承诺验证过的版本组合）
rust-version = "1.99"
description = "Zero-injection Windows taskbar grouping controller (AUMID property-store route)"
license = "MIT"          # 任务 21：AGENTS.md 建议采纳（未引用 mod 逻辑代码，GPL 不传染）
repository = "https://github.com/xixka/taskbar-grouping"
readme = "README.md"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_Storage_FileSystem",
    "Win32_Storage_EnhancedStorage", # PKEY_AppUserModel_ID 常量所在模块（任务 5）
    "Win32_UI_Accessibility",        # SetWinEventHook / WINEVENTPROC（任务 6）
    "Win32_Graphics_Dwm",            # DWMWA_CLOAKED 遮蔽检测（任务 6）
    "Win32_System_Threading",        # CreateMutexW 单实例互斥（任务 22，审计 BUG-02）
    "Win32_Security",                # SECURITY_ATTRIBUTES（CreateMutexW 签名引用，任务 22）
    "Win32_System_Registry",         # HKCU Run 开机自启（任务 19：RegCreateKeyExW 等）
    "Win32_Globalization",           # GetUserDefaultUILanguage 菜单语言自动检测（任务 29）
] }

# §0-7（2026-10-01）：启动时 Win11-only 提示（RtlGetVersion 读真实 build，
# 见 src/oscheck.rs）。官方小 crate，仅依赖锁内已有的 windows-targets。
# 精确钉 0.1.1：与 windows 0.58.0 同发布家族配对；且 0.1.x 后续版
# （≥0.1.7）换依赖 windows-link，会引入锁外新链。
windows-version = "=0.1.1"

# 任务 32：构建期嵌入 VERSIONINFO + 应用清单（winresource；MSVC 目标经宿主
# Windows SDK 的 rc.exe 编译 .res，windows-latest 自带）。default-features =
# false 关闭 toml 特性：仅引入 version_check 一个构建依赖，Cargo.lock 增量
# 最小。见 build.rs。
[build-dependencies]
winresource = { version = "0.1", default-features = false }

# 体积导向 release 配置（对应 docs/plan.md §6 预算：单文件 < 0.5 MB 目标）
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# §0-8（2026-10-02，维护者指令）：注入版删除——原 inj/ 三工作区成员
# （tbg-proto / tbg-hook / tbg-inject）与 [workspace] 节一并移除，仓库回到
# 单包 tbg-lite（根包独立成包，CI 的 --workspace 语义随之收敛为本包）。
# 删除理由与技术结论见 docs/plan.md §0-8 / §5；代码可从 git 历史恢复。

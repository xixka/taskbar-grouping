name: ci

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (audit SEC-02: pinned)

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (audit SEC-02: pinned)

      # 任务 22b（审计 SEC-03）：Cargo.lock 已入库，--locked 保证可复现构建
      - name: Build (release, locked)
        run: cargo build --release --locked

      # 任务 23（审计 P2-13）：纯逻辑单元测试（标记构造/剥离、还原表
      # 往返/损坏拒载、HWND 解析等；dev profile，panic=unwind 可测试）。
      - name: Unit tests
        run: cargo test --locked

  # 任务 22b（审计 SEC-03）：Cargo.lock 新鲜度门禁。
  # lockfile 已入库：generate-lockfile 后工作树必须无 diff（依赖变更
  # 必须连同 Cargo.lock 一起提交），保证 --locked 构建可复现。
  lockfile:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (audit SEC-02: pinned)

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (audit SEC-02: pinned)

      - name: Verify Cargo.lock freshness
        run: |
          cargo generate-lockfile
          git diff --exit-code Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw "Cargo.lock is stale - commit the regenerated lockfile together with Cargo.toml changes" }

  # 任务 9（docs/plan.md Phase 0b-(9)）：运行时冒烟。
  # windows-latest Runner 是真实 Windows 会话：拉起 notepad 窗口，
  # 对两条线路的 AUMID 改写/复原做断言（ci/runtime-smoke.ps1），
  # 并采集桌面截图与 explorer/任务栏可行性探针工件。
  runtime-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (audit SEC-02: pinned)

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (audit SEC-02: pinned)

      - name: Build (release, locked)
        run: cargo build --release --locked

      - name: Runtime smoke (two strategy lines on real windows)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci/runtime-smoke.ps1

      - name: Upload smoke artifacts (logs + screenshots)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (audit SEC-02: pinned)
        with:
          name: runtime-smoke-artifacts
          path: ci/out
          if-no-files-found: warn

  # 任务 10（docs/plan.md v1 §7 Phase 0b 验收）：Phase 0b 验收套件。
  # 两条线路各 50 窗口压测（门禁断言）、常驻内存 <10MB 判定、多应用
  # 覆盖子集（notepad/mspaint/cmd 断言、explorer 记录）、Edge/Chromium
  # 回写探针与 UIA 任务栏按钮枚举（证据性探针，不设门禁）。
  # 验收结论见 docs/phase0b-acceptance.md。
  phase0b-acceptance:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (audit SEC-02: pinned)

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (audit SEC-02: pinned)

      - name: Build (release, locked)
        run: cargo build --release --locked

      - name: Phase 0b acceptance (stress / memory / coverage / UIA)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci/phase0b-accept.ps1

      - name: Upload acceptance artifacts (logs + screenshots)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (audit SEC-02: pinned)
        with:
          name: phase0b-acceptance-artifacts
          path: ci/out
          if-no-files-found: warn

name: ci

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release

      # 任务 23（审计 P2-13）：纯逻辑单元测试（标记构造/剥离、还原表
      # 往返/损坏拒载、HWND 解析等；dev profile，panic=unwind 可测试）。
      - name: Unit tests
        run: cargo test

  # 任务 22（审计 SEC-03）：Cargo.lock 入库（可复现构建）。
  # 本 job 生成 lockfile 并上传 artifact；维护者下载后提交入库。
  # 入库后此 job 转为新鲜度门禁（generate-lockfile 后 git diff 必须为空）
  # 并将 build job 切换为 --locked。
  lockfile:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Upload lockfile artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error

  # 任务 9（docs/plan.md Phase 0b-(9)）：运行时冒烟。
  # windows-latest Runner 是真实 Windows 会话：拉起 notepad 窗口，
  # 对两条线路的 AUMID 改写/复原做断言（ci/runtime-smoke.ps1），
  # 并采集桌面截图与 explorer/任务栏可行性探针工件。
  runtime-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release

      - name: Runtime smoke (two strategy lines on real windows)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci/runtime-smoke.ps1

      - name: Upload smoke artifacts (logs + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-artifacts
          path: ci/out
          if-no-files-found: warn

  # 任务 10（docs/plan.md v1 §7 Phase 0b 验收）：Phase 0b 验收套件。
  # 两条线路各 50 窗口压测（门禁断言）、常驻内存 <10MB 判定、多应用
  # 覆盖子集（notepad/mspaint/cmd 断言、explorer 记录）、Edge/Chromium
  # 回写探针与 UIA 任务栏按钮枚举（证据性探针，不设门禁）。
  # 验收结论见 docs/phase0b-acceptance.md。
  phase0b-acceptance:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release

      - name: Phase 0b acceptance (stress / memory / coverage / UIA)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci/phase0b-accept.ps1

      - name: Upload acceptance artifacts (logs + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0b-acceptance-artifacts
          path: ci/out
          if-no-files-found: warn

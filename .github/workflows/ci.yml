name: ci

on:
  push:
    # 任务 21：分支推送（五 job 验证，维持既有门禁不弱化）+ tag 推送
    # （v* 额外产出发布物：zip + SHA256 + build-provenance attestation，
    # release job needs 五 job 全绿才执行；§0-9：五 = 四 + lint）
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (audit SEC-02: pinned)

      # §0-9：钉版 1.99.0（详见仓库根 rust-toolchain.toml 头注）
      - name: Install Rust (pinned 1.99.0)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # audit SEC-02: pinned
        with:
          toolchain: 1.99.0

      # §0-9：rust-cache 构建缓存（v2.9.2 钉 SHA，SEC-02 口径）：此前每次
      # 推送各编译 job 独立冷编依赖树（单次约 2-4 分钟 ×5）；缓存命中后
      # 增量构建秒级完成，门禁语义不变（各 job 仍从源码独立构建）
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (audit SEC-02: pinned)

      # 任务 22b（审计 SEC-03）：Cargo.lock 已入库，--locked 保证可复现构建
      - name: Build (release, locked)
        run: cargo build --release --locked --workspace

      # 任务 23（审计 P2-13）：纯逻辑单元测试（标记构造/剥离、还原表
      # 往返/损坏拒载、HWND 解析等；dev profile，panic=unwind 可测试）。
      - name: Unit tests
        run: cargo test --locked --workspace

  # 任务 22b（审计 SEC-03）：Cargo.lock 新鲜度门禁。
  # lockfile 已入库：generate-lockfile 后工作树必须无 diff（依赖变更
  # 必须连同 Cargo.lock 一起提交），保证 --locked 构建可复现。
  lockfile:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (audit SEC-02: pinned)

      # §0-9：钉版 1.99.0（详见仓库根 rust-toolchain.toml 头注）
      - name: Install Rust (pinned 1.99.0)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # audit SEC-02: pinned
        with:
          toolchain: 1.99.0

      - name: Verify Cargo.lock freshness
        run: |
          cargo generate-lockfile
          git diff --exit-code Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw "Cargo.lock is stale - commit the regenerated lockfile together with Cargo.toml changes" }

  # 任务 9（docs/plan.md Phase 0b-(9)）：运行时冒烟。
  # windows-latest Runner 是真实 Windows 会话：拉起 notepad 窗口，
  # 对两条线路的 AUMID 改写/复原做断言（ci/runtime-smoke.ps1），
  # 并采集桌面截图与 explorer/任务栏可行性探针工件。
  runtime-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (audit SEC-02: pinned)

      # §0-9：钉版 1.99.0（详见仓库根 rust-toolchain.toml 头注）
      - name: Install Rust (pinned 1.99.0)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # audit SEC-02: pinned
        with:
          toolchain: 1.99.0

      # §0-9：rust-cache 构建缓存（v2.9.2 钉 SHA，SEC-02 口径）：此前每次
      # 推送各编译 job 独立冷编依赖树（单次约 2-4 分钟 ×5）；缓存命中后
      # 增量构建秒级完成，门禁语义不变（各 job 仍从源码独立构建）
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (audit SEC-02: pinned)

      - name: Build (release, locked)
        run: cargo build --release --locked --workspace

      - name: Runtime smoke (two strategy lines on real windows)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci/runtime-smoke.ps1

      - name: Upload smoke artifacts (logs + screenshots)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (audit SEC-02: pinned)
        with:
          name: runtime-smoke-artifacts
          path: ci/out
          if-no-files-found: warn

  # 任务 10（docs/plan.md v1 §7 Phase 0b 验收）：Phase 0b 验收套件。
  # 两条线路各 50 窗口压测（门禁断言）、常驻内存 <10MB 判定、多应用
  # 覆盖子集（notepad/mspaint/cmd 断言、explorer 记录）、Edge/Chromium
  # 回写探针与 UIA 任务栏按钮枚举（证据性探针，不设门禁）。
  # 验收结论见 docs/phase0b-acceptance.md。
  phase0b-acceptance:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (audit SEC-02: pinned)

      # §0-9：钉版 1.99.0（详见仓库根 rust-toolchain.toml 头注）
      - name: Install Rust (pinned 1.99.0)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # audit SEC-02: pinned
        with:
          toolchain: 1.99.0

      # §0-9：rust-cache 构建缓存（v2.9.2 钉 SHA，SEC-02 口径）：此前每次
      # 推送各编译 job 独立冷编依赖树（单次约 2-4 分钟 ×5）；缓存命中后
      # 增量构建秒级完成，门禁语义不变（各 job 仍从源码独立构建）
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (audit SEC-02: pinned)

      - name: Build (release, locked)
        run: cargo build --release --locked --workspace

      - name: Phase 0b acceptance (stress / memory / coverage / UIA)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci/phase0b-accept.ps1

      - name: Upload acceptance artifacts (logs + screenshots)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (audit SEC-02: pinned)
        with:
          name: phase0b-acceptance-artifacts
          path: ci/out
          if-no-files-found: warn

  # 经典任务栏腿（runtime-smoke-inj，windows-2022）已按维护者 2026-10-01
  # 范围指令移除：本项目仅支持 Win11，Win10 用户有其他成熟工具。该腿
  # 首轮运行（run 36805691251）已完成历史使命——证伪"经典任务栏可经
  # 属性存储改写分组"假设（限制⑤为结构性，见 docs/plan.md §5）。
  # 脚本 ci/runtime-smoke-inj.ps1 亦随后删除（git 历史可溯）。

  # §0-9（2026-10-02，审计 P2-14 收口）：静态检查门禁——
  # cargo fmt --all --check + cargo clippy --locked --workspace
  # --all-targets -- -D warnings（默认 lint 组，不加 pedantic：门禁定位是
  # 防漂移而非风格强加）。一次性格式化已随 §0-9 完成（此前仓库从未
  # rustfmt 化）；工具链经 rust-toolchain.toml 钉版，rustfmt / clippy
  # 行为随之确定。release / dev-release 的 needs 自本 job 起纳入
  # （门禁只增不减）。
  lint:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (audit SEC-02: pinned)

      # §0-9：lint 腿安装额外含 clippy / rustfmt 组件
      - name: Install Rust (pinned 1.99.0 + clippy/rustfmt)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # audit SEC-02: pinned
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      # §0-9：rust-cache 构建缓存（同 build job 注）
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (audit SEC-02: pinned)

      - name: rustfmt check
        run: cargo fmt --all --check

      - name: clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # 任务 21（SEC-04）：发布物生成——tag push（v*）触发。五 job 全绿才轮到
  # 本 job（needs 全部）。产物：tbg-lite-<tag>-x86_64-windows.zip +
  # SHA256SUMS.txt + GitHub Release；build-provenance attestation 由
  # actions/attest-build-provenance 出具（任务栏干预类工具易受
  # SmartScreen/杀软误报，可验证来源即信誉）。actions 全部钉 SHA。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, lockfile, runtime-smoke, phase0b-acceptance, lint]
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write      # attestation 所需
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (audit SEC-02: pinned)

      # §0-9：钉版 1.99.0（详见仓库根 rust-toolchain.toml 头注）
      - name: Install Rust (pinned 1.99.0)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # audit SEC-02: pinned
        with:
          toolchain: 1.99.0

      # §0-9：rust-cache 构建缓存（v2.9.2 钉 SHA，SEC-02 口径）：此前每次
      # 推送各编译 job 独立冷编依赖树（单次约 2-4 分钟 ×5）；缓存命中后
      # 增量构建秒级完成，门禁语义不变（各 job 仍从源码独立构建）
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (audit SEC-02: pinned)

      - name: Build (release, locked)
        run: cargo build --release --locked --workspace

      - name: Package + SHA256
        shell: powershell
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $zip = "tbg-lite-$tag-x86_64-windows.zip"
          Compress-Archive -Path target\release\tbg-lite.exe -DestinationPath $zip -Force
          # §0-8（2026-10-02）：注入版 zip（tbg-inject + tbg_hook.dll）随注入
          # 版删除一并移除；本步回到单 zip 发布。
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash
          $size = (Get-Item $zip).Length
          "$sha  $zip" | Set-Content SHA256SUMS.txt -Encoding ascii
          "size_bytes=$size" | Set-Content size.txt -Encoding ascii
          Write-Host "packaged $zip ($size bytes) sha256=$sha"

      - name: Attest build provenance (SEC-04)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 (pinned)
        with:
          # 证明对象：发布 zip（v4 要求显式指定 subject）
          subject-path: tbg-lite-${{ github.ref_name }}-x86_64-windows.zip

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $sums = Get-Content SHA256SUMS.txt
          $liteLine = ($sums | Where-Object { $_ -like '*tbg-lite-*' } | Select-Object -First 1)
          $notes = "tbg-lite $tag`n`nZero-injection edition (the separate injection edition shipped 2026-09-28~2026-10-02 was removed per plan v2 SS0-8: on Windows 11 the taskbar never reads the grouping AUMID through the documented property store, so it could not change grouping).`n`nArtifact: tbg-lite-$tag-x86_64-windows.zip`n  $liteLine`n`nVerification: build provenance attested for the zip (see release attestations); verify locally with 'gh attestation verify <zip> --repo $env:GITHUB_REPOSITORY'.`n`nMSRV: 1.99.0 (pinned via rust-toolchain.toml). Built with cargo build --release --locked --workspace from tag $tag."
          gh release create $tag --title "tbg-lite $tag" --notes $notes tbg-lite-$tag-x86_64-windows.zip SHA256SUMS.txt

  # 任务 27（维护者 2026-09-23 指令）：dev 滚动发布通道。分支推送 → 五 job
  # 门禁全绿 → 覆盖式发布 prerelease `dev`（tag 滚动指向当次 commit）。
  # tag 推送（v*）仍走上方 release 正式通道，两通道互不干扰。
  # 关键点：action-gh-release 不移动已存在的 tag（target_commitish 仅在
  # tag 不存在时生效）→ 发布前先整删旧 release+tag 再全新发布。
  # job 级 concurrency：dev 通道同一时刻只允许一个发布 job，后来的推送
  # 取消在途的（取消无副作用——新 job 会完整重建）。
  dev-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    needs: [build, lockfile, runtime-smoke, phase0b-acceptance, lint]
    runs-on: windows-latest
    concurrency:
      group: dev-release
      cancel-in-progress: true
    permissions:
      contents: write
      id-token: write      # attestation 所需
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (audit SEC-02: pinned)

      # §0-9：钉版 1.99.0（详见仓库根 rust-toolchain.toml 头注）
      - name: Install Rust (pinned 1.99.0)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # audit SEC-02: pinned
        with:
          toolchain: 1.99.0

      # §0-9：rust-cache 构建缓存（v2.9.2 钉 SHA，SEC-02 口径）：此前每次
      # 推送各编译 job 独立冷编依赖树（单次约 2-4 分钟 ×5）；缓存命中后
      # 增量构建秒级完成，门禁语义不变（各 job 仍从源码独立构建）
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (audit SEC-02: pinned)

      - name: Build (release, locked)
        run: cargo build --release --locked --workspace

      - name: Package + SHA256
        shell: powershell
        run: |
          $zip = "tbg-lite-dev-x86_64-windows.zip"
          Compress-Archive -Path target\release\tbg-lite.exe -DestinationPath $zip -Force
          # §0-8（2026-10-02）：注入版 dev zip 随注入版删除移除，回到单 zip。
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash
          $size = (Get-Item $zip).Length
          "$sha  $zip" | Set-Content SHA256SUMS.txt -Encoding ascii
          Write-Host "packaged $zip ($size bytes) sha256=$sha"

      - name: Attest build provenance (SEC-04)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 (pinned)
        with:
          # 证明对象：dev zip（与正式通道同口径，SmartScreen 误报可验源）
          subject-path: tbg-lite-dev-x86_64-windows.zip

      # 滚动回收：gh release delete 连同 tag 一并清理（--cleanup-tag）；
      # git push --delete 兜底"tag 残留而 release 已不在"的边角形态
      # （git 2.47 实测：删除不存在的远端 ref 为幂等成功 exit 0，不报错）。
      # 首次发布无旧资产时 gh 报 not found 走回退提示，不阻断。
      - name: Recycle previous dev release + tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag -y || Write-Host 'no previous dev release'
          git push origin --delete refs/tags/dev 2>$null || Write-Host 'no stray dev tag'

      - name: Publish dev build to GitHub Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 (audit SEC-02: pinned)
        with:
          tag_name: dev
          name: dev
          body: |
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Built at: ${{ github.event.head_commit.timestamp }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            tbg-lite-dev-x86_64-windows.zip
            SHA256SUMS.txt
